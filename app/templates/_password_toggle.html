<!-- app/templates/_password_toggle.html -->

<!--
  Show/hide behaviour for password inputs. Include this once per page that has
  a .password-field wrapper, and give each toggle button
  data-password-toggle="<id of the input>".

  The labels are rendered in from the server rather than written in the script,
  because a string hardcoded in JavaScript is invisible to the translation
  catalog: the button would start out translated and flip back to English on
  the first click. `tojson` does the quoting and escaping.
-->

<script>
(function () {
  var LABELS = {
    show: {{ t("Show") | tojson }},
    hide: {{ t("Hide") | tojson }},
    showAria: {{ t("Show password") | tojson }},
    hideAria: {{ t("Hide password") | tojson }}
  };

  document.querySelectorAll("[data-password-toggle]").forEach(function (button) {
    button.addEventListener("click", function () {
      var field = document.getElementById(button.getAttribute("data-password-toggle"));
      if (!field) return;

      var revealed = field.type === "text";
      field.type = revealed ? "password" : "text";
      button.textContent = revealed ? LABELS.show : LABELS.hide;
      button.setAttribute("aria-label", revealed ? LABELS.showAria : LABELS.hideAria);
    });
  });
})();
</script>
