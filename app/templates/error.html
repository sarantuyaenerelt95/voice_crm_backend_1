<!-- app/templates/error.html -->

<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
  <meta charset="UTF-8">
  <title>{{ status_code }} | Voicebro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/static/voicecrm.css?v=20260828-footer-1">
</head>

<body>

{% if user %}
  {% include "_web_nav.html" %}
{% endif %}

<div class="page-shell" id="main-content">

  <div class="page-header">
    <div>
      <p class="page-eyebrow">{{ status_code }}</p>
      <h1>{{ t(title) }}</h1>
    </div>
  </div>

  <div class="card">
    <div class="alert alert-error">
      {{ t(detail) }}
    </div>

    <div class="actions">
      <a class="btn btn-secondary" href="javascript:history.back()">{{ t("← Back") }}</a>
      <a class="btn" href="/web/dashboard">{{ t("Go to dashboard") }}</a>
    </div>
  </div>

</div>

</body>
</html>
