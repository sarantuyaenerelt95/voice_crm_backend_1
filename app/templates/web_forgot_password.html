<!-- app/templates/web_forgot_password.html -->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Forgot Password | Voicebro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/static/voicecrm.css?v=20260824-audio-2">
</head>

<body>

<nav class="public-nav">
  <div class="top-nav-inner">
    <a class="brand" href="/">
      <span class="brand-mark">VB</span>
      <span class="brand-text">Voicebro</span>
    </a>

    <div class="nav-links">
      <a href="/web/login">Login</a>
      <a href="/web/register">Create account</a>
    </div>
  </div>
</nav>

<main class="page-shell" id="main-content">

  <div class="login-wrap">
    <section class="card">
      <h2>Reset your password</h2>

      <p class="muted">
        Enter your account email. If it's registered, we'll email you a 6-digit code.
      </p>

      {% if message %}
        <div class="alert alert-success">{{ message }}</div>

        <div class="actions">
          <a class="btn" href="/web/reset-password?email={{ email }}">Enter code</a>
        </div>
      {% endif %}

      {% if error %}
        <div class="alert alert-error">{{ error }}</div>
      {% endif %}

      {% if not message %}
      <form method="post" action="/web/forgot-password" class="form-grid">
        <div>
          <label>Email</label>
          <input type="email" name="email" autocomplete="email" required>
        </div>

        <div class="actions">
          <button class="btn" type="submit">Send code</button>
        </div>
      </form>
      {% endif %}

      <p class="muted">
        <a href="/web/login">Back to login</a>
      </p>
    </section>
  </div>

</main>

</body>
</html>
