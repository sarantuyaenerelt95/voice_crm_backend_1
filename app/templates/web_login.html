<!-- app/templates/web_login.html -->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login | Voicebro</title>
  <meta name="description" content="Sign in to Voicebro to manage your voice broadcast campaigns, contacts, audio library and call reports.">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/static/voicecrm.css?v=20260825-qpay-1">
</head>

<body>

<nav class="public-nav">
  <div class="top-nav-inner">
    <a class="brand" href="/">
      <span class="brand-mark">VB</span>
      <span class="brand-text">Voicebro</span>
    </a>

    <div class="nav-links">
      <a class="active" href="/web/login">Login</a>
      <a href="/web/register">Create account</a>
    </div>
  </div>
</nav>

<main class="page-shell" id="main-content">

  <div class="login-wrap">
    <section class="login-panel">
      <span class="badge badge-active">
        Secure workspace
      </span>

      <h1>Login</h1>

      <p class="muted">
        Open your broadcast dashboard, contacts, audio files, and campaign reports.
      </p>
    </section>

    <section class="card">
      <h2>Sign in</h2>

      {% if error %}
        <div class="alert alert-error">
          {{ error }}
        </div>
      {% endif %}

      <form method="post" action="/web/login" class="form-grid">
        <div>
          <label>Email</label>
          <input type="email" name="email" autocomplete="email" required>
        </div>

        <div>
          <label for="password">Password</label>
          <div class="password-field">
            <input type="password" id="password" name="password" autocomplete="current-password" required>
            <button type="button" class="password-toggle" data-password-toggle="password" aria-label="Show password">Show</button>
          </div>
        </div>
        
        <div style="text-align: right; margin-top: -8px;">
          <a href="/web/forgot-password" class="muted small-text">Forgot password?</a>
        </div>
        <div class="actions">
          <button class="btn" type="submit">
            Login
          </button>
        </div>
      </form>

      <p class="muted">
        New here?
        <a href="/web/register">Create an account</a>.
      </p>
    </section>
  </div>

</main>

{% include "_password_toggle.html" %}

</body>
</html>
