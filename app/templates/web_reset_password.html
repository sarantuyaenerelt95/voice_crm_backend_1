<!-- app/templates/web_reset_password.html -->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Reset Password | Voicebro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/static/voicecrm.css?v=20260825-qpay-1">
</head>

<body>

<nav class="public-nav">
  <div class="top-nav-inner">
    <a class="brand" href="/">
      <span class="brand-mark">VB</span>
      <span class="brand-text">Voicebro</span>
    </a>

    <div class="nav-links">
      <a href="/web/login">Login</a>
    </div>
  </div>
</nav>

<main class="page-shell" id="main-content">

  <div class="login-wrap">
    <section class="card">
      <h2>Enter your code</h2>

      <p class="muted">
        Enter the 6-digit code we emailed you, plus your new password.
      </p>

      {% if error %}
        <div class="alert alert-error">{{ error }}</div>
      {% endif %}

      <form method="post" action="/web/reset-password" class="form-grid">
        <div>
          <label>Email</label>
          <input type="email" name="email" value="{{ email }}" autocomplete="email" required>
        </div>

        <div>
          <label>Code</label>
          <input type="text" name="code" inputmode="numeric" pattern="[0-9]{6}"
                 maxlength="6" autocomplete="one-time-code" required
                 placeholder="6-digit code">
        </div>

        <div>
          <label for="password">New password</label>
          <div class="password-field">
            <input type="password" id="password" name="password" autocomplete="new-password" required>
            <button type="button" class="password-toggle" data-password-toggle="password" aria-label="Show password">Show</button>
          </div>
        </div>

        <div>
          <label for="confirm_password">Confirm password</label>
          <div class="password-field">
            <input type="password" id="confirm_password" name="confirm_password" autocomplete="new-password" required>
            <button type="button" class="password-toggle" data-password-toggle="confirm_password" aria-label="Show password">Show</button>
          </div>
        </div>

        <div class="actions">
          <button class="btn" type="submit">Reset password</button>
        </div>
      </form>

      <p class="muted">
        <a href="/web/forgot-password">Didn't get a code? Request a new one</a>
      </p>
    </section>
  </div>

</main>

{% include "_password_toggle.html" %}

</body>
</html>
